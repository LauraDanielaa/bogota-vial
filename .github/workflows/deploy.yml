# Verificar y desplegar.
#
# En cada push o pull request a main se revisa que el proyecto compile. En los push a main,
# si la variable DESPLIEGUE_ACTIVO es "true", además se actualiza el servidor por SSH:
#   1. se baja el código y se reconstruyen los contenedores;
#   2. se espera a que la API responda;
#   3. se actualizan los datos y los modelos de ML (deploy/actualizar-modelos.sh). Cada modelo
#      decide si le toca correr; si este paso falla, la web conserva los resultados que ya tenía
#      y el workflow termina con una advertencia, sin tumbar el despliegue.
#
# Configuración (GitHub -> Settings -> Secrets and variables -> Actions):
#   Secrets:   VPS_HOST (IP del servidor), VPS_USER (ubuntu), VPS_SSH_KEY (llave privada)
#   Variables: DESPLIEGUE_ACTIVO = true   (mientras no exista el servidor, dejarla sin crear)

name: Verificar y desplegar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # botón "Run workflow" para desplegar a mano
    inputs:
      recalcular_modelos:
        description: "Volver a entrenar los modelos que se conservan entre despliegues (riesgo de atraso)"
        type: boolean
        default: false

concurrency:
  group: despliegue-${{ github.ref }}
  cancel-in-progress: false # nunca cortar un despliegue a la mitad

jobs:
  verificar:
    name: Verificar que todo compila
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revisar sintaxis de Python (backend, ETL y ML)
        run: python -m compileall -q backend/app etl ml

      - name: Revisar sintaxis de los scripts de despliegue
        run: for f in deploy/*.sh; do bash -n "$f"; done

      - name: Validar docker compose de producción
        env:
          DOMINIO: ejemplo.com
          DB_NAME: x
          DB_USER: x
          DB_PASSWORD: x
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

  desplegar:
    name: Desplegar en el servidor
    needs: verificar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DESPLIEGUE_ACTIVO == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar y reiniciar contenedores por SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/bogota-vial
            git fetch --prune origin main
            git reset --hard origin/main
            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
            $COMPOSE up -d --build --remove-orphans
            docker image prune -f

            # Esperar a que la API responda (máx. ~2 min)
            en_linea=no
            for i in $(seq 1 24); do
              if $COMPOSE exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)" 2>/dev/null; then
                echo "API en línea"
                en_linea=si
                break
              fi
              sleep 5
            done
            if [ "$en_linea" != si ]; then
              echo "La API no respondió después del despliegue"
              $COMPOSE logs --tail=80 backend
              exit 1
            fi

      # ETL + modelos. Si falla, el despliegue sigue en pie (continue-on-error) y el paso
      # siguiente deja la advertencia.
      - name: Actualizar datos y modelos
        id: modelos
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd /opt/bogota-vial
            bash deploy/actualizar-modelos.sh --commit ${{ github.sha }} ${{ inputs.recalcular_modelos && '--recalcular' || '' }}
            estado=$?
            docker image prune -f
            exit $estado

      - name: Advertir si no se pudieron actualizar los datos o los modelos
        if: steps.modelos.outcome == 'failure'
        run: |
          echo "::warning title=Datos y modelos::No se pudieron actualizar los datos o algún modelo para el commit ${GITHUB_SHA::12}. La web sigue con los resultados anteriores. Revisa el log del paso 'Actualizar datos y modelos'."
          {
            echo "### Datos y modelos sin actualizar"
            echo ""
            echo "El despliegue terminó, pero la actualización de datos o de algún modelo falló para el commit \`${GITHUB_SHA::12}\`."
            echo "La web sigue mostrando los últimos resultados guardados. El detalle está en el log del paso *Actualizar datos y modelos*."
          } >> "$GITHUB_STEP_SUMMARY"
