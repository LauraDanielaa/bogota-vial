# Despliegue automático: en cada push a main se verifica que todo compile y,
# si la variable del repo DESPLIEGUE_ACTIVO es "true", se actualiza el servidor por SSH.
#
# Configuración (GitHub -> Settings -> Secrets and variables -> Actions):
#   Secrets:   VPS_HOST (IP del servidor), VPS_USER (ubuntu), VPS_SSH_KEY (llave privada)
#   Variables: DESPLIEGUE_ACTIVO = true   (mientras no exista el servidor, dejarla sin crear)
#
# Riesgo de atraso (modelo ml/riesgo_prorroga): se calcula solo en el primer despliegue
# (cuando la base aún no tiene un modelo entrenado) con deploy/calcular-riesgo.sh.
# Los despliegues siguientes conservan el riesgo ya calculado. Para recalcularlo
# (p. ej. con datos nuevos): Actions -> Verificar y desplegar -> Run workflow ->
# marcar "Volver a calcular el riesgo de atraso".
#
# Contratos atípicos (modelo ml/atipicos): en cada push a main, después de verificar la API,
# deploy/calcular-atipicos.sh corre el ETL y el modelo UNA vez por commit (el commit queda en
# ml_atipicos_ejecucion; si ya existe una ejecución exitosa para él, no se repite). Si falla,
# la web sigue con la ejecución anterior y el workflow muestra una advertencia. No corre en PR.

name: Verificar y desplegar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # botón "Run workflow" para desplegar a mano
    inputs:
      recalcular_riesgo:
        description: "Volver a calcular el riesgo de atraso (ETL + modelo)"
        type: boolean
        default: false

concurrency:
  group: despliegue-${{ github.ref }}
  cancel-in-progress: false # nunca cortar un despliegue a la mitad

jobs:
  verificar:
    name: Verificar que todo compila
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revisar sintaxis de backend y ETL
        run: python -m compileall -q backend/app etl

      - name: Revisar sintaxis de ML (riesgo de prórroga y contratos atípicos)
        run: |
          python -m compileall -q ml
          bash -n deploy/calcular-riesgo.sh deploy/calcular-atipicos.sh

      - name: Validar docker compose de producción
        env:
          DOMINIO: ejemplo.com
          DB_NAME: x
          DB_USER: x
          DB_PASSWORD: x
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

  desplegar:
    name: Desplegar en el servidor
    needs: verificar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DESPLIEGUE_ACTIVO == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar y reiniciar contenedores por SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/bogota-vial
            git fetch --prune origin main
            git reset --hard origin/main
            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
            $COMPOSE up -d --build --remove-orphans
            docker image prune -f

            # Esperar a que la API responda (máx. ~2 min)
            en_linea=no
            for i in $(seq 1 24); do
              if $COMPOSE exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)" 2>/dev/null; then
                echo "API en línea"
                en_linea=si
                break
              fi
              sleep 5
            done
            if [ "$en_linea" != si ]; then
              echo "La API no respondió después del despliegue"
              $COMPOSE logs --tail=80 backend
              exit 1
            fi

            # Riesgo de atraso: solo se calcula si la base aún no tiene un modelo entrenado,
            # o si se pidió desde "Run workflow" (casilla recalcular_riesgo)
            bash deploy/calcular-riesgo.sh ${{ inputs.recalcular_riesgo && '--forzar' || '' }}
            docker image prune -f

      # Contratos atípicos: ETL + modelo, una sola vez por commit (si el commit ya tiene una
      # ejecución exitosa, no hace nada). Si falla, la web sigue con la ejecución anterior y
      # el despliegue NO se cae (continue-on-error); el paso siguiente deja una advertencia.
      - name: Contratos atípicos (ETL + modelo, una vez por commit)
        id: atipicos
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/bogota-vial
            bash deploy/calcular-atipicos.sh ${{ github.sha }}
            docker image prune -f

      - name: Advertir si falló el modelo de contratos atípicos
        if: steps.atipicos.outcome == 'failure'
        run: |
          echo "::warning title=Contratos atípicos::El modelo de contratos atípicos falló para el commit ${GITHUB_SHA::12}. La web sigue mostrando la ejecución anterior. Revisa el log del paso 'Contratos atípicos'."
          {
            echo "### ⚠️ Contratos atípicos: el modelo falló"
            echo ""
            echo "El despliegue terminó, pero el modelo no se ejecutó para el commit \`${GITHUB_SHA::12}\`."
            echo "La web sigue mostrando la última ejecución exitosa."
          } >> "$GITHUB_STEP_SUMMARY"
