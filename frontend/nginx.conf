server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Peticiones a la API -> contenedor del backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # index.html nunca se guarda en caché: así cada build nuevo se ve al recargar
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Los archivos de /assets llevan un hash en el nombre: se pueden guardar para siempre
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
